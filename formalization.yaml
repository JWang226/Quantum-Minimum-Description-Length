fidelity:
  divergences: The physical orbit uses a diagonal reference and arbitrary U(d) conjugation. Rows are zero-based
    natural partitions, with a signed dominant difference. Memory cost is log2 of dimension; the liminf
    is taken in the extended reals. The proof constructs explicit Cartan/Choi/Petz channels and replaces
    atypical sectors by explicit replacement channels. It supplies an explicit cloning constant. The final
    converse uses a weaker but uniform positive spectral-gap constant than the sharp intermediate lemma
    in the manuscript. These changes preserve the requested theorem conclusions. Broader generalized-channel
    propositions and the later entropy/unknown-spectrum discussion are not claimed in full. Detailed per-statement
    coverage is in metadata/natural-language-map.json.
review:
  status: agent-reviewed
  reviewers:
  - Codex agents
  notes: The earlier source-first agent review retains its original dates and revision. The bounded cleanup
    bridge covers the baseline, and metadata/statement-audit/physical-interface-bridge.json covers the
    three added proof modules while checking that all 270 baseline source files and four original endpoint
    statements are unchanged. The supplemental physical expected statement restates tensor density, normalized
    compression and Choi contraction; its two roots include a proved existence statement. The lower representation
    coordinates, generators and numerical bounds remain shared, as documented by the compiled dependency-closure
    guard. Current execution status and context are recorded in the source-bound Comparator, Nanoda and
    verification reports; historical records do not establish new runs. Independent human correspondence
    review, source-author endorsement and Linux-sandboxed Comparator execution are not asserted.
