site_name: "Quantum Minimum Description — Lean Proofs"
site_description: "Statements, proof route and reproducible Lean, Comparator and Nanoda checks for quantum minimum description length"
site_url: "https://jwang226.github.io/Quantum-Minimum-Description-Length/"

docs_dir: docs
site_dir: site

# Check the generated map for every local build and GitHub Pages deployment.
hooks:
  - scripts/generate_correspondence.py

# These documents link to proof/source files outside docs/ and are read on GitHub.
# The wiki's formalization page links to their repository versions.
exclude_docs: |
  /AI_PROVENANCE.md
  /FORMALIZATION_STATUS.md
  /RELEASE_CHECKLIST.md
  /REPRODUCIBILITY.md
  /PROOF_EXPLORER.md

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
    - content.tooltips
    - content.code.copy
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - roamlinks

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.mark
  - admonition
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/proof-explorer.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/site.css
  - stylesheets/proof-explorer.css

extra:
  social: []

